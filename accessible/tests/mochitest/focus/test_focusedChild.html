<html>

<head>
  <title>nsIAccessible::focusedChild testing</title>

  <link rel="stylesheet" type="text/css"
        href="chrome://mochikit/content/tests/SimpleTest/test.css" />

  <script type="application/javascript"
          src="chrome://mochikit/content/tests/SimpleTest/SimpleTest.js"></script>

  <script type="application/javascript"
          src="../common.js"></script>
  <script type="application/javascript"
          src="../role.js"></script>
  <script type="application/javascript"
          src="../states.js"></script>
  <script type="application/javascript"
          src="../events.js"></script>

  <script type="application/javascript">
    function openWnd()
    {
      var focusReady;
      this.focusPromise = new Promise(resolve => { focusReady = resolve; });
      this.eventSeq = [ new invokerChecker(EVENT_FOCUS,
                                           getDialogAccessible,
                                           this) ];

      this.invoke = function openWnd_invoke()
      {
        // about:mozilla disables script event listeners, including waitForFocus.
        this.dialog = window.openDialog("chrome://global/content/mozilla.xhtml",
                                        "AboutMozilla",
                                        "chrome,width=600,height=600");
        var dialog = this.dialog;
        SimpleTest.registerCleanupFunction(function() { dialog.close(); });
        dialog.addEventListener("load", function loaded(event) {
          if (event.target != dialog.document || dialog.location == "about:blank")
            return;
          dialog.removeEventListener("load", loaded, true);
          SimpleTest.waitForFocus(function() {
            ok(dialog.document.hasFocus(), "Dialog has DOM focus before checking accessibility focus");
            focusReady();
          }, dialog);
        }, true);
      }

      this.finalCheck = function openWnd_finalCheck()
      {
        var app = getApplicationAccessible();
        is(app.focusedChild, getDialogAccessible(this),
           "Wrong focused child");

      }

      this.getID = function openWnd_getID()
      {
        return "focusedChild for application accessible";
      }

      function getDialogAccessible(aInvoker)
      {
        return getAccessible(aInvoker.dialog.document);
      }
    }

    gA11yEventDumpToConsole = true;
    var gQueue = null;

    function doTest()
    {
      enableLogging("focus,doclifecycle");
      SimpleTest.registerCleanupFunction(disableLogging);
      gQueue = new eventQueue();

      var invoker = new openWnd();
      gQueue.push(invoker);

      gQueue.onFinish = function() {
        invoker.focusPromise.then(SimpleTest.finish);
        return DO_NOT_FINISH_TEST;
      }
      gQueue.invoke(); // Will call SimpleTest.finish();
    }

    SimpleTest.waitForExplicitFinish();
    addA11yLoadEvent(doTest);
  </script>
</head>

<body>

  <a target="_blank"
     href="https://bugzilla.mozilla.org/show_bug.cgi?id=677467"
     title="focusedChild crashes on application accessible">
    Mozilla Bug 677467
  </a>
  <p id="display"></p>
  <div id="content" style="display: none"></div>
  <pre id="test">
  </pre>

</body>
</html>
