<body>
<a target="_blank" href="https://bugzilla.mozilla.org/show_bug.cgi?id=637644">Mozilla Bug 637644</a>
<p id="display"></p>
<div id="content" style="display: none">
  
</div>
<pre id="test">
<script type="application/javascript">

/** Test for Bug 637644 **/
SimpleTest.waitForExplicitFinish();

addLoadEvent(function() {
SpecialPowers.pushPrefEnv({set: [["browser.link.open_newwindow", 2]]}, function() {
var win1 = window.open("", "", "height=500,width=500");
// Keep the font language identical to the loaded English helper documents.
win1.document.documentElement.lang = "en";
win1.document.body.textContent = "Should show";

var windowsLoaded = 0;

window.onmessage = function (ev) {
  is(ev.data, "loaded", "Message should be 'loaded'");
  if (++windowsLoaded == 2) {
    var one = snapshotWindow(win1);
    var two = snapshotWindow(win2);
    var three = snapshotWindow(win3);
    win1.close();
    win2.close();
    win3.close();
    assertSnapshots(one, two, true, null, "first popup", "same-content popup");
    assertSnapshots(one, three, false, null, "first popup", "empty popup");

    SimpleTest.finish();
  }
}

var win2 = window.open("file_bug637644_1.html", "", "height=500,width=500");
var win3 = window.open("file_bug637644_2.html", "", "height=500,width=500");
});
});
</script>
