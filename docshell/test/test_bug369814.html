<p>

<pre id="test">
<script class="testbody" type="text/javascript">

/** Tests for Bug 369814 **/

// The former script/refresh/anchor cases require a web-loadable JAR URI.
// UXP 1c261b24f1 makes these local resources. Verify each payload is rejected
// before scripts/navigation can run, including when unsafe-type loading is on.
function contentRequest(url, responseType) {
  return new Promise(resolve => {
    const xhr = new XMLHttpRequest();
    let failed = false;
    xhr.onerror = () => { failed = true; };
    xhr.onloadend = () => resolve({failed, status: xhr.status, response: xhr.response});
    // Executor exceptions reject the promise; only an actual channel error
    // may satisfy the denial assertions below.
    xhr.open("GET", url, true);
    xhr.responseType = responseType;
    xhr.send();
  });
}

SimpleTest.waitForExplicitFinish();
(async function testJarNavigationPolicy() {
  const archive = await contentRequest(
    "http://mochi.test:8888/tests/docshell/test/bug369814.zip", "arraybuffer");
  is(archive.status, 200, "The backing HTTP archive is available");
  is(new Uint8Array(archive.response)[0], 0x50, "The backing resource is a ZIP archive");
  const cases = [
    ["iframes.html", false], ["refresh.html", true],
    ["iframes.html", true], ["anchors.html", true]
  ];
  for (const [entry, unsafe] of cases) {
    await SpecialPowers.pushPrefEnv({set: [
      ["network.jar.block-remote-files", false], ["network.jar.open-unsafe-types", unsafe]
    ]});
    const url = "jar:http://mochi.test:8888/tests/docshell/test/bug369814.zip!/" + entry;
    const result = await contentRequest(url, "document");
    ok(result.failed, entry + " is rejected before parsing, unsafe-types=" + unsafe);
    is(result.status, 0, "Blocked archive payload is not a successful document response");
    is(result.response, null, "No archive document is exposed to content");
    await SpecialPowers.popPrefEnv();
  }
})().then(() => SimpleTest.finish(), error => {
  ok(false, "JAR navigation policy check failed: " + error);
  SimpleTest.finish();
});
</script>
</pre>
