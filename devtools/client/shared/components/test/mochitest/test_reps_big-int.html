<!DOCTYPE HTML>
<html>
<head>
  <meta charset="utf-8">
  <title>Rep test - BigInt</title>
  <script type="application/javascript" src="chrome://mochikit/content/tests/SimpleTest/SimpleTest.js"></script>
  <link rel="stylesheet" type="text/css" href="chrome://mochikit/content/tests/SimpleTest/test.css">
</head>
<body>
<pre id="test">
<script src="head.js" type="application/javascript;version=1.8"></script>
<script type="application/javascript;version=1.8">
"use strict";

window.onload = Task.async(function* () {
  const { Rep } = browserRequire("devtools/client/shared/components/reps/rep");
  const { BigInt } = browserRequire("devtools/client/shared/components/reps/big-int");

  try {
    // Protocol BigInts contain decimal text, including values beyond the
    // precision of Number. Keep dispatch and rendering independent of coercion.
    for (let text of ["0", "18446744073709551617", "-18446744073709551617"]) {
      const object = { type: "BigInt", text };
      const renderedRep = shallowRenderComponent(Rep, { object });
      is(renderedRep.type, BigInt.rep,
         `Rep correctly selects BigInt for ${text}`);

      const renderedComponent = renderComponent(Rep, { object });
      is(renderedComponent.textContent, text + "n",
         `BigInt rep preserves the value ${text}`);
    }
  } catch (e) {
    ok(false, "Got an error: " + DevToolsUtils.safeErrorString(e));
  } finally {
    SimpleTest.finish();
  }
});
</script>
</pre>
</body>
</html>
