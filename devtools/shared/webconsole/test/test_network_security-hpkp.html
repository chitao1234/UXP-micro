<!DOCTYPE HTML>
<html lang="en">
<head>
  <meta charset="utf8">
  <title>Test for the network actor (HPKP detection)</title>
  <script type="text/javascript" src="chrome://mochikit/content/tests/SimpleTest/SimpleTest.js"></script>
  <script type="text/javascript;version=1.8" src="common.js"></script>
  <!-- Any copyright is dedicated to the Public Domain.
     - http://creativecommons.org/publicdomain/zero/1.0/ -->
</head>
<body>
<p>Test for the network actor (HPKP detection)</p>

<iframe src="https://example.com/chrome/devtools/shared/webconsole/test/network_requests_iframe.html"></iframe>

<script class="testbody" type="text/javascript;version=1.8">
SimpleTest.waitForExplicitFinish();

let gCurrentTestCase = -1;
// UXP 55aa6ce7b3 removed HPKP; 3bc5d67c98 stopped its DevTools query.
// HTTPS security information must keep reporting no pinning even when an
// obsolete Public-Key-Pins response header is present.
const TEST_CASES = [
  {
    desc: "no Public Key Pinning",
    url: "https://example.com",
    usesPinning: false,
    hasHeader: false,
  },
  {
    desc: "an obsolete Public-Key-Pins response header",
    url: "https://example.com/" +
         "chrome/devtools/shared/webconsole/test/network_security_headers.sjs?hpkp",
    usesPinning: false,
    hasHeader: true,
  },
  {
    desc: "no pinning after the obsolete header",
    url: "https://example.com/",
    usesPinning: false,
    hasHeader: false,
  }
];

function startTest()
{
  info("Test that obsolete HPKP does not affect HTTPS security information.");
  removeEventListener("load", startTest);
  attachConsoleToTab(["NetworkActivity"], onAttach);
}

function onAttach(aState, aResponse)
{
  onNetworkEventUpdate = onNetworkEventUpdate.bind(null, aState);
  aState.dbgClient.addListener("networkEventUpdate", onNetworkEventUpdate);

  runNextCase(aState);
}

function runNextCase(aState) {
  gCurrentTestCase++;
  if (gCurrentTestCase === TEST_CASES.length) {
    info("Tests ran. Cleaning up.");
    closeDebugger(aState, SimpleTest.finish);
    return;
  }

  let { desc, url } = TEST_CASES[gCurrentTestCase];
  aState.securityUpdates = new Map();
  info("Testing site with " + desc);

  let iframe = document.querySelector("iframe").contentWindow;
  iframe.wrappedJSObject.makeXhrCallback("GET", url);
}

function onNetworkEventUpdate(aState, aType, aPacket)
{
  function onSecurityInfo(packet) {
    let data = TEST_CASES[gCurrentTestCase];
    is(packet.securityInfo.state, "secure", "The HTTPS request remains secure without HPKP");
    is(packet.securityInfo.hpkp, data.usesPinning,
      "Public Key Pinning detected correctly.");

    aState.client.getResponseHeaders(aPacket.from, response => {
      let header = response.headers.find(item => item.name.toLowerCase() === "public-key-pins");
      is(!!header, data.hasHeader, "The expected Public-Key-Pins header crosses the network actor");
      if (header) {
        ok(header.value.includes("max-age=60"), "The obsolete pin header was served by the fixture");
      }
      runNextCase(aState);
    });
  }

  if (aPacket.updateType === "securityInfo" || aPacket.updateType === "responseHeaders") {
    let updates = aState.securityUpdates.get(aPacket.from) || new Set();
    updates.add(aPacket.updateType);
    aState.securityUpdates.set(aPacket.from, updates);
    if (!updates.has("securityInfo") || !updates.has("responseHeaders") || updates.has("requested")) {
      return;
    }
    updates.add("requested");
    aState.client.getSecurityInfo(aPacket.from, onSecurityInfo);
  }
}

addEventListener("load", startTest);
</script>
</body>
</html>
