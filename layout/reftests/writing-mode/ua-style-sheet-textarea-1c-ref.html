<!DOCTYPE html>
<meta charset=utf-8>
<title>Test for logical properties of textarea in the UA stylesheet</title>
<style>
.v-rl { writing-mode: vertical-rl; }
.ltr, .rtl, .v-rl { border: 1px solid blue; }

/* Keep the native padding on both sides of this comparison: Windows supplies
   it in device pixels, scaled for the theme DPI.  This reference checks the
   logical margins; the unthemed comparison separately checks UA padding. */
.ltr textarea, .rtl textarea {
  margin: 1px 0;
}
.v-rl textarea {
  margin: 0 1px;
}
</style>
<div class=ltr>
  <textarea>hello</textarea>
</div>

<div class=rtl dir=rtl>
  <textarea>hello</textarea>
</div>

<div class=v-rl>
  <textarea>hello</textarea>
</div>
