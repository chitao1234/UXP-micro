<!doctype html>
<html class="reftest-wait">
<meta charset="utf-8">
<style>
html,body{margin:0;background:white}
#background{width:700px;height:1500px;background:linear-gradient(135deg,#02a,#fa0)}
#patch{position:absolute;left:40px;top:60px;width:100px;height:80px;background:red}
#translucent{position:absolute;left:240px;top:100px;width:200px;height:180px;background:rgba(255,0,255,.5);transform:rotate(9deg)}
#fixed{position:fixed;left:0;top:0;width:600px;height:20px;background:lime}
</style>
<div id="background"></div><div id="patch"></div><div id="translucent"></div><div id="fixed"></div>
<script>
window.onload=function(){
  // Establish both buffers, let the spare expire, then dirty only a small
  // region. Untouched pixels must survive reconstruction from the front.
  requestAnimationFrame(function(){
    document.getElementById('patch').style.width='101px';
    setTimeout(function(){
      document.getElementById('patch').style.background='blue';
      window.scrollTo(0,120);
      requestAnimationFrame(function(){
        setTimeout(function(){
          window.scrollTo(0,0);
          document.getElementById('translucent').style.transform='rotate(-9deg)';
          requestAnimationFrame(function(){
            setTimeout(function(){document.documentElement.removeAttribute('class');},200);
          });
        },200);
      });
    },200);
  });
};
</script>
</html>
