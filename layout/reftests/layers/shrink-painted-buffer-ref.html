<!doctype html>
<meta charset="utf-8">
<style>
html,body{margin:0;background:white}
#panel{position:absolute;left:20px;top:20px;width:220px;height:180px;overflow:hidden;transform:translateZ(0)}
#background{width:900px;height:900px;background:repeating-linear-gradient(20deg,#147 0px,#147 20px,#fed 20px,#fed 40px)}
#patch{position:absolute;left:30px;top:40px;width:72px;height:50px;background:blue}
#alpha{position:absolute;left:110px;top:70px;width:100px;height:100px;background:rgba(20,220,60,.5);transform:rotate(9deg)}
</style>
<div id="panel"><div id="background"></div><div id="patch"></div><div id="alpha"></div></div>
<script>window.onload=function(){var panel=document.getElementById('panel');panel.scrollLeft=17;panel.scrollTop=23;};</script>
