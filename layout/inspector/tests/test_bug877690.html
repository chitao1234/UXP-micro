<!DOCTYPE HTML>
<html>
<!-- https://bugzilla.mozilla.org/show_bug.cgi?id=877690 -->
<head>
<meta charset="utf-8">
<title>Test for Inspector keyword completions</title>
<script src="/tests/SimpleTest/SimpleTest.js"></script>
<link rel="stylesheet" href="/tests/SimpleTest/test.css"/>
<script>

// Strict comparison borrowed from Firefox 78's test_bug877690.html.  Missing,
// extra, and duplicate values must all fail; the old forEach helper ignored
// missing values by returning only from its callback.
function testValues(values, expected) {
  values = values.slice().sort();
  expected = expected.slice().sort();
  if (values.length !== expected.length) {
    info("Expected values: " + JSON.stringify(expected));
    info("Actual values: " + JSON.stringify(values));
    return false;
  }
  for (let i = 0; i < values.length; ++i) {
    if (values[i] !== expected[i]) {
      info("Expected values: " + JSON.stringify(expected));
      info("Actual values: " + JSON.stringify(values));
      return false;
    }
  }
  return true;
}

// Use an independent literal oracle, following current Firefox's factored
// CSS-wide keyword cases.  This tree has no getCSSWideKeywords API.
const CSS_WIDE_KEYWORDS = [
  "initial", "inherit", "unset", "revert", "revert-layer"
];
const utils = SpecialPowers.Cc["@mozilla.org/inspector/dom-utils;1"]
  .getService(SpecialPowers.Ci.inIDOMUtils);

function getValues(prop) {
  return Array.from(utils.getCSSValuesForProperty(prop));
}

function checkValues(prop, expected) {
  ok(testValues(getValues(prop), expected), prop + " has all and only its completions");
}

function runTests() {
  // Keep the named-color oracle from the ESR52 test: this API returns actual
  // color names, whereas newer InspectorUtils returns a COLOR placeholder.
  const allColors = [
    "aliceblue", "antiquewhite", "aqua", "aquamarine", "azure", "beige", "bisque", "black",
    "blanchedalmond", "blue", "blueviolet", "brown", "burlywood", "cadetblue", "chartreuse",
    "chocolate", "coral", "cornflowerblue", "cornsilk", "crimson", "currentColor", "cyan",
    "darkblue", "darkcyan", "darkgoldenrod", "darkgray", "darkgreen", "darkgrey", "darkkhaki",
    "darkmagenta", "darkolivegreen", "darkorange", "darkorchid", "darkred", "darksalmon",
    "darkseagreen", "darkslateblue", "darkslategray", "darkslategrey", "darkturquoise",
    "darkviolet", "deeppink", "deepskyblue", "dimgray", "dimgrey", "dodgerblue", "firebrick",
    "floralwhite", "forestgreen", "fuchsia", "gainsboro", "ghostwhite", "gold", "goldenrod",
    "gray", "grey", "green", "greenyellow", "honeydew", "hotpink", "indianred", "indigo",
    "ivory", "khaki", "lavender", "lavenderblush", "lawngreen", "lemonchiffon", "lightblue",
    "lightcoral", "lightcyan", "lightgoldenrodyellow", "lightgray", "lightgreen", "lightgrey",
    "lightpink", "lightsalmon", "lightseagreen", "lightskyblue", "lightslategray",
    "lightslategrey", "lightsteelblue", "lightyellow", "lime", "limegreen", "linen",
    "magenta", "maroon", "mediumaquamarine", "mediumblue", "mediumorchid", "mediumpurple",
    "mediumseagreen", "mediumslateblue", "mediumspringgreen", "mediumturquoise",
    "mediumvioletred", "midnightblue", "mintcream", "mistyrose", "moccasin", "navajowhite",
    "navy", "oldlace", "olive", "olivedrab", "orange", "orangered", "orchid", "palegoldenrod",
    "palegreen", "paleturquoise", "palevioletred", "papayawhip", "peachpuff", "peru", "pink",
    "plum", "powderblue", "purple", "rebeccapurple", "red", "rosybrown", "royalblue",
    "saddlebrown", "salmon", "sandybrown", "seagreen", "seashell", "sienna", "silver",
    "skyblue", "slateblue", "slategray", "slategrey", "snow", "springgreen", "steelblue",
    "tan", "teal", "thistle", "tomato", "transparent", "turquoise", "violet", "wheat",
    "white", "whitesmoke", "yellow", "yellowgreen", "rgb", "hsl", "rgba", "hsla"
  ];
  // The local completion API reports these eight gradient functions.  The
  // newer Firefox test also lists functions absent from this API.
  const allGradients = [
    "linear-gradient", "radial-gradient", "repeating-linear-gradient",
    "repeating-radial-gradient", "-moz-linear-gradient", "-moz-radial-gradient",
    "-moz-repeating-linear-gradient", "-moz-repeating-radial-gradient"
  ];
  const imageFunctions = ["-moz-element", "-moz-image-rect", "url", ...allGradients];
  const borderValues = [
    "thin", "medium", "thick", "none", "hidden", "dotted", "dashed", "solid",
    "double", "groove", "ridge", "inset", "outset", ...allColors
  ];

  checkValues("color", [...CSS_WIDE_KEYWORDS, ...allColors]);
  // Background and border-image expectations are adapted from Firefox 78.
  checkValues("background", [
    ...CSS_WIDE_KEYWORDS, ...allColors, "auto", "no-repeat", "repeat", "repeat-x",
    "repeat-y", "space", "round", "fixed", "scroll", "local", "center", "top",
    "bottom", "left", "right", "border-box", "padding-box", "content-box", "text",
    "contain", "cover", "none", ...imageFunctions
  ]);
  // Firefox 78's border oracle excludes border-image values: the shorthand
  // resets those longhands but accepts only border width, style, and color.
  // Keep the calc function names accepted and exposed by this Gecko API.
  checkValues("border", [
    ...CSS_WIDE_KEYWORDS, ...borderValues, "calc", "-moz-calc"
  ]);
  const borderCompletions = getValues("border");
  for (let [keyword, declaration] of [
    ["auto", "auto"], ["fill", "fill"], ["repeat", "repeat"],
    ["round", "round"], ["stretch", "stretch"], ["space", "space"],
    ["url", 'url("x")'], ["linear-gradient", "linear-gradient(red, blue)"],
    ["-moz-element", "-moz-element(#x)"]
  ]) {
    ok(!CSS.supports("border", declaration), "border rejects reset-only input " + declaration);
    ok(!borderCompletions.includes(keyword), "border does not complete reset-only keyword " + keyword);
  }
  for (let declaration of [
    "1px solid red", "calc(1px + 1px) solid red", "-moz-calc(1px + 1px) solid red"
  ]) {
    ok(CSS.supports("border", declaration), "border accepts " + declaration);
  }
  checkValues("border-top", [
    ...CSS_WIDE_KEYWORDS, ...borderValues, "calc", "-moz-calc"
  ]);
  checkValues("padding-bottom", [...CSS_WIDE_KEYWORDS, "calc", "-moz-calc"]);

  const displayValues = [
    "none", "inline", "block", "inline-block", "list-item", "table", "inline-table",
    "table-row-group", "table-header-group", "table-footer-group", "table-row",
    "table-column-group", "table-column", "table-cell", "table-caption", "-moz-box",
    "-moz-inline-box", "-moz-grid", "-moz-inline-grid", "-moz-grid-group", "-moz-grid-line",
    "-moz-stack", "-moz-inline-stack", "-moz-deck", "-moz-popup", "-moz-groupbox", "flex",
    "inline-flex", "-webkit-box", "-webkit-inline-box", "-webkit-flex", "-webkit-inline-flex",
    "grid", "inline-grid", "ruby", "ruby-base", "ruby-base-container", "ruby-text",
    "ruby-text-container", "contents", "flow-root"
  ];
  checkValues("display", [...CSS_WIDE_KEYWORDS, ...displayValues]);
  checkValues("float", [...CSS_WIDE_KEYWORDS, "none", "left", "right", "inline-start", "inline-end"]);
  checkValues("margin", [...CSS_WIDE_KEYWORDS, "auto", "calc", "-moz-calc"]);
  checkValues("font-style", [...CSS_WIDE_KEYWORDS, "italic", "normal", "oblique"]);
  checkValues("-moz-transition", [
    ...CSS_WIDE_KEYWORDS, "all", "cubic-bezier", "ease", "ease-in", "ease-in-out",
    "ease-out", "linear", "none", "step-end", "step-start", "steps"
  ]);

  let threw = false;
  try {
    getValues("invalidProperty");
  } catch (e) {
    threw = true;
  }
  ok(threw, "an invalid property throws");

  checkValues("border-image", [
    ...CSS_WIDE_KEYWORDS, "auto", "repeat", "stretch", "fill", "none", "round",
    "space", ...imageFunctions
  ]);

  // Function-parsed properties still have enumerable keyword tables.  The
  // background-size case comes from Firefox 78; expand its direct-longhand
  // coverage to the other tables used by the shorthand cases above.
  const positionValues = ["left", "right", "top", "bottom", "center"];
  const cases = [
    ["background-position", positionValues],
    ["background-position-x", ["left", "right", "center"]],
    ["background-position-y", ["top", "bottom", "center"]],
    ["background-size", ["auto", "contain", "cover"]],
    ["mask-position", positionValues],
    ["mask-position-x", ["left", "right", "center"]],
    ["mask-position-y", ["top", "bottom", "center"]],
    ["mask-size", ["auto", "contain", "cover"]],
    ["border-image-repeat", ["stretch", "repeat", "round", "space"]],
    ["border-image-slice", ["fill"]],
    ["border-image-width", ["auto"]]
  ];
  for (let [prop, keywords] of cases) {
    checkValues(prop, [...CSS_WIDE_KEYWORDS, ...keywords]);
    for (let value of [...CSS_WIDE_KEYWORDS, ...keywords]) {
      // 'fill' is a component of the slice grammar, not a whole slice value.
      let declaration = prop === "border-image-slice" && value === "fill"
                        ? "1 fill" : value;
      ok(CSS.supports(prop, declaration), prop + ": " + declaration + " is accepted by the parser");
    }
  }
  for (let [prop, value] of [
    ["background-position", "contain"], ["background-position-x", "top"],
    ["background-position-y", "left"], ["background-size", "fill"],
    ["mask-position-x", "top"], ["mask-position-y", "left"], ["mask-size", "fill"],
    ["border-image-repeat", "fill"], ["border-image-slice", "fill"],
    ["border-image-width", "cover"]
  ]) {
    ok(!CSS.supports(prop, value), prop + ": " + value + " is rejected by the parser");
  }

  // A disabled entry is a hole, not the end of a keyword table.  In the display
  // table the enabled contents/flow-root entries follow the WebKit entries.
  SpecialPowers.pushPrefEnv({set: [["layout.css.prefixes.webkit", false]]}, function() {
    const noWebkit = displayValues.filter(value => !value.startsWith("-webkit-"));
    checkValues("display", [...CSS_WIDE_KEYWORDS, ...noWebkit]);
    ok(!CSS.supports("display", "-webkit-box"), "disabled WebKit value is rejected");
    ok(CSS.supports("display", "contents"), "contents remains enabled after a table hole");
    SpecialPowers.pushPrefEnv({set: [["layout.css.display-contents.enabled", false]]}, function() {
      checkValues("display", [
        ...CSS_WIDE_KEYWORDS, ...noWebkit.filter(value => value !== "contents")
      ]);
      ok(!CSS.supports("display", "contents"), "disabled contents value is rejected");
      ok(CSS.supports("display", "flow-root"), "flow-root remains enabled after a table hole");
      SimpleTest.finish();
    });
  });
}

SimpleTest.waitForExplicitFinish();
addLoadEvent(runTests);
</script>
</head>
<body>
<a target="_blank" href="https://bugzilla.mozilla.org/show_bug.cgi?id=877690">Mozilla Bug 877690</a>
</body>
</html>
