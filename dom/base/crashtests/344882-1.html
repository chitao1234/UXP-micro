<html class="reftest-wait">
<head>
<script>
var obj;

function boo()
{
  obj = document.getElementById("obj");
  // javascript: object loads are blocked by the scheme policy (as in current
  // Firefox). Drive the second mutation from the load error instead of waiting
  // for script execution that the policy intentionally prevents.
  obj.addEventListener("error", function() {
    if (obj.data == "javascript:setScriptSrc2();") {
      setScriptSrc2();
    }
  });
  setScriptSrc();
}

function setScriptSrc()
{
  obj.data = "javascript:setScriptSrc2();";
}

function setScriptSrc2() 
{
  obj.data = "javascript:void 0";

  document.documentElement.removeAttribute("class");
}

</script>
</head>

<body onload="setTimeout(boo, 30);">

<object data="../../../testing/crashtest/images/tree.gif" id="obj">

</body>

</html>
