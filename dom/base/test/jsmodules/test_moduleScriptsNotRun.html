<!DOCTYPE html>
<meta charset=utf-8>
<title>Test script elements with type="module" run for content HTML</title>
<script type="text/javascript" src="/tests/SimpleTest/SimpleTest.js"></script>
<script>
  var inlineModuleRan = false;
  var moduleRan = false;

  SimpleTest.waitForExplicitFinish();

  function testLoaded() {
    // The historical filename predates support for modules in content.
    ok(moduleRan, "Check external module script was run");
    ok(inlineModuleRan, "Check inline module script was run");
    SimpleTest.finish();
  }
</script>
<script type="module" src="module_setRan.js"></script>
<script type="module">inlineModuleRan = true;</script>
<body onload='testLoaded()'></body>
