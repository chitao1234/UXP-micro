<!DOCTYPE HTML>

<head>
  <meta charset="utf-8">
  <title>Test for Bug 804395</title>
  <script type="application/javascript" src="/tests/SimpleTest/SimpleTest.js"></script>
  <link rel="stylesheet" type="text/css" href="/tests/SimpleTest/test.css"/>
</head>
<body>
<a target="_blank" href="https://bugzilla.mozilla.org/show_bug.cgi?id=804395">Mozilla Bug 804395</a>
<p id="display"></p>
<div id="content" style="display: none">

</div>
<pre id="test">
<script type="application/javascript">

// UXP classifies jar: as a local resource. The status contract belongs to a
// privileged archive caller, not a content principal granted systemXHR.
SimpleTest.waitForExplicitFinish();
SpecialPowers.pushPrefEnv({set: [["network.jar.block-remote-files", false]]}, () => {
  const chrome = SpecialPowers.loadChromeScript(function() {
    const {classes: Cc, interfaces: Ci} = Components;
    function request(entry, send) {
      return new Promise(resolve => {
        const xhr = Cc["@mozilla.org/xmlextras/xmlhttprequest;1"].createInstance(Ci.nsIXMLHttpRequest);
        xhr.open("GET", "jar:http://example.org/tests/dom/base/test/file_bug804395.jar!/" + entry, true);
        if (!send) {
          resolve(xhr.status);
          return;
        }
        xhr.onloadend = () => resolve(xhr.status);
        xhr.send();
      });
    }
    Promise.all([request("foo.bar", true), request("foo.do_not_exist", true),
                 request("foo.bar", false)])
      .then(statuses => sendAsyncMessage("statuses", statuses),
            error => sendAsyncMessage("error", String(error)));
  });
  chrome.addMessageListener("statuses", statuses => {
    is(statuses[0], 200, "Existing archive member has status 200");
    is(statuses[1], 404, "Missing archive member has status 404");
    is(statuses[2], 0, "Unsent archive request has status 0");
    chrome.destroy();
    SimpleTest.finish();
  });
  chrome.addMessageListener("error", error => {
    ok(false, "Archive status request failed: " + error);
    chrome.destroy();
    SimpleTest.finish();
  });
});
</script>
</pre>
</body>
</html>
