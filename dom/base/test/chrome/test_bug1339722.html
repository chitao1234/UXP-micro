<!DOCTYPE HTML>
<html>
<!--
https://bugzilla.mozilla.org/show_bug.cgi?id=1339722
-->
<head>
  <meta charset="utf-8">
  <title>Test for Bug 1339722</title>
  <script type="application/javascript" src="chrome://mochikit/content/tests/SimpleTest/SimpleTest.js"></script>
  <link rel="stylesheet" type="text/css" href="chrome://global/skin"/>
  <link rel="stylesheet" type="text/css" href="chrome://mochikit/content/tests/SimpleTest/test.css"/>
  <script type="application/javascript">

  /**
   * Test for Bug 1339722
   * 1. Wait for "http-on-modify-request" for the iframe load.
   * 2. In the observer, access its window proxy.
   * 3. In the subsequent DOMWindowCreated handler, delete the iframe.
   * 4. Verify the observer/query/removal phases complete without a crash.
   *
   * Direct HTTP channels may create the initial about:blank before notifying
   * the request observer. Ignore that setup event; this test does not require
   * DOMWindowCreated to be synchronous with the window-proxy query.
  **/

  const {interfaces: Ci, utils: Cu} = Components;
  Cu.import("resource://gre/modules/Services.jsm");

  // Firefox changed this topic in bug 1513574 after removing
  // http-on-useragent-request. This tree still uses direct HTTP channels.
  const TOPIC = 'http-on-modify-request';
  const REQUEST_URI = 'http://www.example.com/';
  let observedRequest = false;
  let observerRegistered = false;
  let queryStarted = false;
  let queryReturned = false;
  let iframeRemoved = false;
  let windowProxy;

  let docShell = SpecialPowers.wrap(window)
                              .QueryInterface(Ci.nsIInterfaceRequestor)
                              .getInterface(Ci.nsIDocShell);

  function stopObserving() {
    if (observerRegistered) {
      Services.obs.removeObserver(observer, TOPIC);
      observerRegistered = false;
    }
  }

  const observer = {
    observe(subject, topic, data) {
      let channel = subject.QueryInterface(Ci.nsIHttpChannel);
      let iframe = document.getElementById('testFrame');
      let loadInfo = channel.loadInfo;
      if (channel.URI.spec === REQUEST_URI) {
        info('Test URI request: type=' + loadInfo.externalContentPolicyType +
             ', contextMatches=' + (loadInfo.loadingContext === iframe));
      }
      if (channel.URI.spec !== REQUEST_URI ||
          loadInfo.externalContentPolicyType !== Ci.nsIContentPolicy.TYPE_SUBDOCUMENT ||
          loadInfo.loadingContext !== iframe) {
        return;
      }

      info('Got ' + topic + ' for the test iframe');
      stopObserving();
      observedRequest = true;

      // Exercise the regression's window-proxy query.
      queryStarted = true;
      windowProxy = channel.notificationCallbacks.getInterface(Ci.mozIDOMWindowProxy);
      queryReturned = true;
      info('Window-proxy query returned after iframe removal: ' + iframeRemoved);
    }
  };

  function onWindowCreated(e) {
    let iframe = document.getElementById('testFrame');
    if (!iframe || e.target.defaultView.frameElement !== iframe) {
      return;
    }
    if (!observedRequest && e.target.documentURI === 'about:blank') {
      info('Ignoring initial about:blank before the test request');
      return;
    }
    docShell.chromeEventHandler.removeEventListener('DOMWindowCreated', onWindowCreated);
    info('DOMWindowCreated: URI=' + e.target.documentURI +
         ', queryInProgress=' + (queryStarted && !queryReturned));
    ok(observedRequest, 'tested document creation must follow the matching request observer');
    ok(queryStarted, 'the observer must query the window proxy before tested document creation');
    is(e.target, iframe.contentDocument, 'verify event target');

    // Remove the iframe from its document-created callback.
    info('Removing iframe: queryInProgress=' + (queryStarted && !queryReturned));
    iframe.remove();
    iframeRemoved = true;
    setTimeout($ => {
      ok(queryReturned && windowProxy, 'the observer window-proxy query completed');
      ok(!document.getElementById('testFrame'), 'verify iframe removed');
      SimpleTest.finish();
    }, 0);
  }

  SimpleTest.registerCleanupFunction(() => {
    stopObserving();
    docShell.chromeEventHandler.removeEventListener('DOMWindowCreated', onWindowCreated);
    let iframe = document.getElementById('testFrame');
    if (iframe) {
      iframe.remove();
    }
  });

  docShell.chromeEventHandler.addEventListener('DOMWindowCreated', onWindowCreated);
  Services.obs.addObserver(observer, TOPIC, false);
  observerRegistered = true;
  SimpleTest.waitForExplicitFinish();
  </script>
</head>
<body>
<a target="_blank" href="https://bugzilla.mozilla.org/show_bug.cgi?id=1339722">Mozilla Bug 1339722</a>
<p id="display"></p>
<div id="content" style="display: none"></div>
<pre id="test">
  <div id="frameContainer">
    <iframe id="testFrame" src="http://www.example.com"></iframe>
  </div>
</pre>
</body>
</html>
