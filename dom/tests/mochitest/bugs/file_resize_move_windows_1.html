<!DOCTYPE HTML>
<html>
<head><title>Helper for test_resize_move_windows.html</title></head>
<body>
<script>
function check(next) {
  function is_range(actual, expected, range, message) {
    window.opener.ok(actual < expected + range && actual > expected - range,
                     message + ": " + actual + " vs. " + expected);
  }
  is_range(window.innerWidth, 300, 5, "parameter width should be taken into account");
  is_range(window.innerHeight, 300, 5, "parameter height should be taken into account");
  is_range(window.screenX, 65, 5, "parameter screenX should be taken into account");
  is_range(window.screenY, 65, 5, "parameter screenY should be taken into account");
  window.opener.checkChangeIsEnabled(window, next);
}
</script>
</body>
</html>
