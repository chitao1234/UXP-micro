<!DOCTYPE HTML>
<html>
<!--
https://bugzilla.mozilla.org/show_bug.cgi?id=764240
-->
<head>
  <meta charset="utf-8">
  <title>Test for Bug 764240</title>
  <script type="application/javascript" src="/tests/SimpleTest/SimpleTest.js"></script>
  <script type="application/javascript" src="/tests/SimpleTest/EventUtils.js"></script>
  <link rel="stylesheet" type="text/css" href="/tests/SimpleTest/test.css"/>
</head>
<body>
<a target="_blank" href="https://bugzilla.mozilla.org/show_bug.cgi?id=764240">Mozilla Bug 764240</a>
<p id="display"></p>
<div id="content">
  <button onclick="test();">run test</button>
</div>
<pre id="test">
<script type="application/javascript">

/** Test for Bug 764240 **/

SimpleTest.waitForExplicitFinish();

// Error margin allowed for the window's size. Windows has varying minimum
// sizes depending on the os due to outer window chrome. Unix is given 5
// pixels to protect against minor variances.
var epsilon =  navigator.platform.indexOf("Win") == -1 ? 5 : 20;

function test() {
  // Window chrome/native themes can impose a minimum larger than100px. Use
  // window.open's100px result as an independent reference for the clamp;
  // sizeToContent must shrink a300px popup to the same dimensions.
  var reference = window.open("file_empty.html", "", "width=100,height=100");
  SimpleTest.registerCleanupFunction(() => reference.close());
  SimpleTest.waitForFocus(function() {
    var expectedWidth = reference.innerWidth;
    var expectedHeight = reference.innerHeight;
    ok(expectedWidth >= 100 && expectedWidth < 300 - epsilon,
       "The reference width is clamped and smaller than the test popup");
    ok(expectedHeight >= 100 && expectedHeight < 300 - epsilon,
       "The reference height is clamped and smaller than the test popup");
    reference.close();

    var w = window.open("file_empty.html", "", "width=300,height=300");
    SimpleTest.registerCleanupFunction(() => w.close());
    SimpleTest.waitForFocus(function() {
      var executed = false;
      w.onresize = function() {
        if (w.innerWidth > 300 - epsilon || executed) {
          return;
        }
        executed = true;
        ok(Math.abs(w.innerWidth - expectedWidth) <= epsilon,
           "sizeToContent width matches the independently clamped100px popup: " +
           w.innerWidth + " versus " + expectedWidth);
        ok(Math.abs(w.innerHeight - expectedHeight) <= epsilon,
           "sizeToContent height matches the independently clamped100px popup: " +
           w.innerHeight + " versus " + expectedHeight);
        w.close();
        SimpleTest.waitForFocus(SimpleTest.finish);
      };
      w.sizeToContent();
    }, w);
  }, reference);
}

// The sizeToContent regression needs a resizable popup, not a tab.
SpecialPowers.pushPrefEnv({set: [["browser.link.open_newwindow", 2]]}, function() {
  SimpleTest.waitForFocus(function() {
    synthesizeMouseAtCenter(document.getElementsByTagName('button')[0], {});
  });
});

</script>
</pre>
</body>
</html>
