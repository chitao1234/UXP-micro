<!DOCTYPE HTML>
<meta charset="utf-8">
<title>Navigator privacy signal after the DNT-to-GPC migration</title>
<script src="/tests/SimpleTest/SimpleTest.js"></script>
<link rel="stylesheet" href="/tests/SimpleTest/test.css">
<script>
// UXP c030a50228 replaced DNT with GPC without migrating this fixture.
// Window/worker value checks follow current Firefox's WPT gpc tests.
SimpleTest.waitForExplicitFinish();
(async function privacySignal() {
  const pref = "privacy.GPCheader.enabled";
  ok(!("doNotTrack" in navigator), "The retired DNT getter is not exposed");
  is(typeof navigator.globalPrivacyControl, "boolean", "GPC is a boolean");
  const defaultValue = navigator.globalPrivacyControl;
  for (const enabled of [true, false]) {
    await SpecialPowers.pushPrefEnv({set: [[pref, enabled]]});
    is(navigator.globalPrivacyControl, enabled, "Window GPC reflects " + enabled);
    const source = new Blob([
      "onmessage = () => postMessage({value: navigator.globalPrivacyControl, " +
      "type: typeof navigator.globalPrivacyControl});"
    ], {type: "application/javascript"});
    const url = URL.createObjectURL(source);
    const worker = new Worker(url);
    try {
      const result = await new Promise((resolve, reject) => {
        worker.onmessage = event => resolve(event.data);
        worker.onerror = reject;
        worker.postMessage(null);
      });
      is(result.type, "boolean", "Worker GPC is a boolean");
      is(result.value, enabled, "Worker GPC reflects " + enabled);
    } finally {
      worker.terminate();
      URL.revokeObjectURL(url);
    }
    await SpecialPowers.popPrefEnv();
    is(navigator.globalPrivacyControl, defaultValue, "Privacy preference is restored");
  }
})().then(() => SimpleTest.finish(), error => {
  ok(false, "Privacy-signal test failed: " + error);
  SimpleTest.finish();
});
</script>
