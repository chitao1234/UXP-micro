<!DOCTYPE HTML>
<html>
<head>
  <title>Custom element v1 lifecycle callbacks</title>
  <script src="/tests/SimpleTest/SimpleTest.js"></script>
  <link rel="stylesheet" href="/tests/SimpleTest/test.css">
</head>
<body>
<div id="container"></div>
<script>
// Port of the former document.registerElement scenarios to customElements.
// Expectations follow Firefox's WPT custom-elements/{upgrading,
// attribute-changed-callback,connected-callbacks,disconnected-callbacks}.html.
// define() upgrades connected candidates only; disconnected trees use upgrade().
const container = document.getElementById("container");

for (const extended of [false, true]) {
  const Base = extended ? HTMLButtonElement : HTMLElement;
  const suffix = extended ? "button" : "autonomous";
  const name = "x-lifecycle-" + suffix;
  let log = [];
  let constructed;
  class CustomElement extends Base {
    constructor() {
      super();
      constructed = this;
      is(Object.getPrototypeOf(this), CustomElement.prototype,
         "The registered prototype is installed before the constructor");
      log.push("constructor");
    }
    connectedCallback() {
      is(this, constructed, "connectedCallback receives the constructed element");
      log.push("connected");
    }
    disconnectedCallback() {
      is(this, constructed, "disconnectedCallback receives the constructed element");
      log.push("disconnected");
    }
    attributeChangedCallback(attr, oldValue, newValue, namespace) {
      is(this, constructed, "attributeChangedCallback receives the constructed element");
      is(namespace, null, "The attribute is not namespaced");
      log.push([attr, oldValue, newValue]);
    }
    static get observedAttributes() { return ["changeme"]; }
  }
  function markup(tag) {
    return extended ? '<button is="' + tag + '"></button>' :
                      '<' + tag + '></' + tag + '>';
  }
  function define(tag, ctor) {
    if (extended) {
      customElements.define(tag, ctor, {extends: "button"});
    } else {
      customElements.define(tag, ctor);
    }
  }
  function create(tag) {
    return extended ? document.createElement("button", {is: tag}) :
                      document.createElement(tag);
  }

  // Existing connected elements upgrade synchronously when defined.
  container.innerHTML = markup(name);
  const unresolved = container.firstChild;
  is(Object.getPrototypeOf(unresolved), Base.prototype, "Initially unresolved");
  define(name, CustomElement);
  is(constructed, unresolved, "Registration upgrades the existing element");
  isDeeply(log, ["constructor", "connected"], "Upgrade precedes connection");
  container.removeChild(unresolved);
  isDeeply(log, ["constructor", "connected", "disconnected"],
           "Removing the upgraded element disconnects it");

  // Creation after registration and innerHTML in a disconnected subtree.
  log = [];
  const elem = create(name);
  is(constructed, elem, "createElement invokes the registered constructor");
  isDeeply(log, ["constructor"], "Creation alone does not connect");
  container.appendChild(elem);
  container.removeChild(elem);
  isDeeply(log, ["constructor", "connected", "disconnected"],
           "Insertion and removal invoke synchronous lifecycle callbacks");
  log = [];
  const holder = document.createElement("div");
  holder.innerHTML = markup(name);
  is(constructed, holder.firstChild, "innerHTML constructs registered elements");
  isDeeply(log, ["constructor"], "Detached innerHTML does not connect");
  holder.textContent = "";

  // A detached pre-definition candidate requires explicit upgrade in v1.
  const upgradeName = "x-upgrade-" + suffix;
  holder.innerHTML = markup(upgradeName);
  const candidate = holder.firstChild;
  class UpgradeElement extends Base {
    constructor() { super(); log.push("upgrade"); }
    connectedCallback() { log.push("connected"); }
    disconnectedCallback() { log.push("disconnected"); }
  }
  log = [];
  define(upgradeName, UpgradeElement);
  isDeeply(log, [], "define must not upgrade disconnected candidates");
  customElements.upgrade(holder);
  is(Object.getPrototypeOf(candidate), UpgradeElement.prototype,
     "Explicit upgrade installs the registered prototype");
  isDeeply(log, ["upgrade"], "Explicit upgrade constructs without connecting");
  container.appendChild(holder);
  container.removeChild(holder);
  isDeeply(log, ["upgrade", "connected", "disconnected"],
           "Connecting a containing subtree invokes descendant callbacks");

  // Observed attributes, old/new values, and registration-time callbacks.
  constructed = elem;
  log = [];
  elem.setAttribute("changeme", "newvalue");
  elem.setAttribute("changeme", "nextvalue");
  elem.setAttribute("changeme", "");
  elem.removeAttribute("changeme");
  elem.setAttribute("unobserved", "ignored");
  isDeeply(log, [["changeme", null, "newvalue"],
                ["changeme", "newvalue", "nextvalue"],
                ["changeme", "nextvalue", ""], ["changeme", "", null]],
           "Only observed attributes invoke callbacks with exact old/new values");
  CustomElement.prototype.attributeChangedCallback = function() {
    ok(false, "Mutation must not replace the callback captured at definition");
  };
  log = [];
  elem.setAttribute("changeme", "cached");
  isDeeply(log, [["changeme", null, "cached"]], "Definition retains its callback");

  // Detached fragment/subtree moves do not invoke connection callbacks.
  log = [];
  const fragment = document.createDocumentFragment();
  fragment.appendChild(elem);
  fragment.removeChild(elem);
  holder.appendChild(elem);
  holder.removeChild(elem);
  isDeeply(log, [], "Moves entirely outside the document do not connect or disconnect");
}

const candidate = document.createElement("x-never-defined");
container.appendChild(candidate);
candidate.setAttribute("foo", "bar");
container.removeChild(candidate);
is(Object.getPrototypeOf(candidate), HTMLElement.prototype,
   "Mutating an undefined candidate leaves it unresolved");
</script>
</body>
</html>
