<!DOCTYPE HTML>
<meta charset="utf-8">
<title>Shadow DOM v1 slot assignment and fallback</title>
<script src="/tests/SimpleTest/SimpleTest.js"></script>
<link rel="stylesheet" href="/tests/SimpleTest/test.css">
<div id="host"></div>
<script>
// Slot/name/default/fallback vectors adapted from current Firefox's WPT
// shadow-dom/slots.html. UXP removed the v0 content/select insertion API.
const host = document.getElementById("host");
const root = host.attachShadow({mode: "open"});
function nodes(actual, expected, message) {
  is(actual.length, expected.length, message + " length");
  expected.forEach((node, index) => is(actual[index], node, message + " node " + index));
}

host.innerHTML = '<div id="one" slot="first"></div><div id="two" slot="second"></div><div id="other" slot="missing"></div>';
root.innerHTML = '<slot name="first"></slot><slot name="second"></slot><slot name="unused"></slot>';
let [first, second, unused] = root.children;
let [one, two, other] = host.children;
is(one.assignedSlot, first, "Slot names select their matching child");
is(two.assignedSlot, second, "Second slot selects its matching child");
is(other.assignedSlot, null, "Unmatched child has no slot");
nodes(first.assignedNodes(), [one], "First assignment");
nodes(unused.assignedNodes(), [], "Unused assignment");
const snapshot = first.assignedNodes();
const extra = document.createElement("span");
extra.slot = "first";
host.appendChild(extra);
nodes(snapshot, [one], "Assignment result is a static array");
nodes(first.assignedNodes(), [one, extra], "A new child updates assignment in tree order");

root.innerHTML = '<slot name="first"></slot><slot name="first"></slot><slot></slot>';
[first, second] = root.children;
nodes(first.assignedNodes(), [one, extra], "First matching slot wins");
nodes(second.assignedNodes(), [], "Later duplicate slot is empty");
root.insertBefore(second, first);
nodes(second.assignedNodes(), [one, extra], "Reordering duplicate slots changes assignment");
nodes(first.assignedNodes(), [], "Previous first slot loses its assignment");
second.remove();
nodes(second.assignedNodes(), [], "Detached slot has no assignment");
nodes(first.assignedNodes(), [one, extra], "Remaining matching slot receives assignment");

host.innerHTML = '<div></div><div slot=""></div><div slot="unknown"></div>';
root.innerHTML = '<slot name="named"></slot><slot></slot><slot></slot>';
const defaultSlot = root.children[1];
nodes(defaultSlot.assignedNodes(), [host.children[0], host.children[1]], "Default slot handles missing and empty names");
nodes(root.children[2].assignedNodes(), [], "Only the first default slot is assigned");
const nested = document.createElement("span");
host.children[0].appendChild(nested);
is(nested.assignedSlot, null, "Only direct host children are slotables");

host.innerHTML = '';
root.innerHTML = '<slot><span id="fallback1"></span><span id="fallback2"></span></slot>';
const fallbackSlot = root.firstChild;
const fallback = Array.from(fallbackSlot.children);
nodes(fallbackSlot.assignedNodes(), [], "Fallback is not a direct assignment");
nodes(fallbackSlot.assignedNodes({flatten: true}), fallback, "Flattened fallback preserves both nodes");
const assigned = document.createElement("div");
host.appendChild(assigned);
nodes(fallbackSlot.assignedNodes({flatten: true}), [assigned], "An assigned child suppresses fallback");
assigned.remove();
nodes(fallbackSlot.assignedNodes({flatten: true}), fallback, "Removing assigned content restores fallback");
const outside = document.createElement("slot");
document.body.appendChild(outside);
nodes(outside.assignedNodes(), [], "Slot outside a shadow tree receives no assignment");
</script>
