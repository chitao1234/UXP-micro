<!DOCTYPE HTML>
<html>
<head>
  <title>Custom element v1 reaction stack</title>
  <script src="/tests/SimpleTest/SimpleTest.js"></script>
  <link rel="stylesheet" href="/tests/SimpleTest/test.css">
</head>
<body>
<div id="container"></div>
<script>
// Port the document.registerElement stack scenarios using v1 reactions.
// Constructor-upgrade behavior follows Firefox's WPT
// custom-elements/custom-element-reaction-queue.html; nested reactions follow
// enqueue-custom-element-callback-reactions-inside-another-callback.html.
// An upgrading constructor must not enqueue callbacks for its own mutations
// (unlike the removed v0 createdCallback).
const container = document.getElementById("container");
let log = [];
container.innerHTML = "<x-stack-upgrade></x-stack-upgrade>";
class UpgradeElement extends HTMLElement {
  constructor() {
    super();
    log.push("constructor-begin");
    this.setAttribute("foo", "bar");
    log.push("constructor-end");
  }
  connectedCallback() { log.push("connected"); }
  attributeChangedCallback() { log.push("attribute"); }
  static get observedAttributes() { return ["foo"]; }
}
customElements.define("x-stack-upgrade", UpgradeElement);
isDeeply(log, ["constructor-begin", "constructor-end", "connected"],
         "Attribute mutation while upgrading does not invoke attributeChangedCallback");
container.firstChild.setAttribute("foo", "after-upgrade");
is(log[3], "attribute", "Attribute callbacks work after upgrade completes");

log = [];
class ChangeOnConnect extends HTMLElement {
  connectedCallback() {
    log.push("connected-begin");
    this.setAttribute("foo", "bar");
    log.push("connected-end");
  }
  attributeChangedCallback(name, oldValue, newValue) {
    is(name, "foo", "The observed attribute changed");
    is(oldValue, null, "The attribute was initially absent");
    is(newValue, "bar", "The attribute has the new value");
    log.push("attribute");
  }
  static get observedAttributes() { return ["foo"]; }
}
customElements.define("x-stack-connect", ChangeOnConnect);
container.appendChild(document.createElement("x-stack-connect"));
isDeeply(log, ["connected-begin", "attribute", "connected-end"],
         "A nested setter invokes its reaction before returning to connectedCallback");

log = [];
class RemoveOnConnect extends HTMLElement {
  connectedCallback() {
    is(this.parentNode, container, "The element is inserted before its callback");
    log.push("connected-begin");
    container.removeChild(this);
    log.push("connected-end");
  }
  disconnectedCallback() { log.push("disconnected"); }
}
customElements.define("x-stack-remove", RemoveOnConnect);
const removed = document.createElement("x-stack-remove");
container.appendChild(removed);
isDeeply(log, ["connected-begin", "disconnected", "connected-end"],
         "Nested removal invokes disconnectedCallback before returning");
is(removed.parentNode, null, "The callback removed the element");

log = [];
const sequence = ["foo", "bar", "baz"];
class RecursiveAttributes extends HTMLElement {
  attributeChangedCallback(name, oldValue, newValue) {
    log.push(newValue);
    if (newValue !== "baz") {
      this.setAttribute("foo", sequence.shift());
      is(this.getAttribute("foo"), "baz", "Nested attribute reactions finish before unwinding");
      log.push("return-" + newValue);
    }
  }
  static get observedAttributes() { return ["foo"]; }
}
customElements.define("x-stack-attributes", RecursiveAttributes);
document.createElement("x-stack-attributes").setAttribute("foo", "changeme");
isDeeply(log, ["changeme", "foo", "bar", "baz", "return-bar", "return-foo", "return-changeme"],
         "Attribute reactions are nested and unwind in stack order");
is(sequence.length, 0, "All recursive changes ran");
</script>
</body>
</html>
