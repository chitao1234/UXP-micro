<!DOCTYPE html>
<html>
<!--
https://bugzilla.mozilla.org/show_bug.cgi?id=430251
-->
<head>
  <title>postMessage origin checks and blocked web JAR URIs</title>
  <script type="text/javascript" src="/tests/SimpleTest/SimpleTest.js"></script>        
  <link rel="stylesheet" type="text/css" href="/tests/SimpleTest/test.css" />
  <base href="http://mochi.test:8888/" />
</head>
<body>
<a target="_blank" href="https://bugzilla.mozilla.org/show_bug.cgi?id=430251">Mozilla Bug 430251</a>
<p id="display"></p>
<div id="content" style="display: none"></div>

<pre id="test">
<script class="testbody" type="application/javascript">
/** Test for Bug 430251 **/

SimpleTest.waitForExplicitFinish();

function receiveMessage(evt)
{
  is(evt.origin, "http://mochi.test:8888", "wrong sender");
  ok(evt.source === window.frames.kid, "wrong source");

  is(evt.data, "finish-test", "wrong data");
  is(evt.lastEventId, "", "wrong lastEventId");

  SimpleTest.finish();
}

window.addEventListener("message", receiveMessage, false);

function contentRequest(url, responseType) {
  return new Promise(resolve => {
    const xhr = new XMLHttpRequest();
    let failed = false;
    xhr.onerror = () => { failed = true; };
    xhr.onloadend = () => resolve({failed, status: xhr.status, response: xhr.response});
    // Executor exceptions reject the promise; only an actual channel error
    // may satisfy the denial assertions below.
    xhr.open("GET", url, true);
    xhr.responseType = responseType;
    xhr.send();
  });
}

addLoadEvent(function() {
  SpecialPowers.pushPrefEnv({"set": [["network.jar.block-remote-files", false]]}, async function() {
    var iframe = document.createElement('iframe');
    const jarURL = "jar:http://mochi.test:8888/tests/dom/tests/mochitest/whatwg/postMessage.jar!/postMessage_jar.html";
    const result = await contentRequest(jarURL, "document");
    ok(result.failed, "Web content cannot open a JAR channel despite the legacy pref");
    is(result.status, 0, "Blocked JAR request has no successful HTTP status");
    iframe.setAttribute('src', '/tests/dom/tests/mochitest/whatwg/postMessage_archive_helper.html');
    iframe.setAttribute('name', 'kid');


    iframe.onload = function() {
      window.frames.kid.postMessage("start-test", "http://mochi.test:8888");
    };
    document.getElementById("content").appendChild(iframe);
  });
});
</script>
</pre>
</body>
</html>
