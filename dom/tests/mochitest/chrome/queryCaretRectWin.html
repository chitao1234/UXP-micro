<!DOCTYPE HTML>
<html>
<head>
<title>nsIDOMWindowUtils::sendQueryContentEvent w/QUERY_CARET_RECT test</title>
<script type="text/javascript" src="chrome://mochikit/content/tests/SimpleTest/SimpleTest.js"></script>
<link rel="stylesheet" type="text/css" href="chrome://mochikit/content/tests/SimpleTest/test.css">

<!--
  #########################################################
  # WARNING: this file has Windows line endings. If you
  # update this file please maintain them. Line endings are
  # taken into account when calculating query caret rect
  # values.
  #########################################################
-->

<style>
  #text {
  position: absolute;
  left: 0em;
  top: 0em;
  font-size: 10pt;
  font-family: 'Courier New';
  line-height: 20px;
  letter-spacing: 0px;
  margin-top:-1px; /* nix the text area border */
  overflow: hidden;
  width:800px;
  height:400px;
  }
  #div-hor {
  position: absolute;
  left: 0em;
  border-top:1px solid lightgray;
  width: 1000px;
  pointer-events:none;
  }
  #div-ver {
  position: absolute;
  top: 0em;
  border-left:1px solid lightgray;
  height: 500px;
  pointer-events:none;
 }
</style>

<script type="application/javascript;version=1.8">
  var SimpleTest = window.opener.SimpleTest;
  var Ci = Components.interfaces;

  function ok() { window.opener.ok.apply(window.opener, arguments); }
  function is() { window.opener.is.apply(window.opener, arguments); }
  function done() { window.opener.done.apply(window.opener, arguments); }

  function dumpLn() {
    for (let idx = 0; idx < arguments.length; idx++)
      dump(arguments[idx] + " ");
    dump("\n");
  }

  // drawn grid is 20x20
  function drawGrid() {
    for (var idx = 0; idx < 20; idx++) {
      var e = document.createElement("div");
      e.setAttribute("id", "div-hor");
      e.style.top = (idx*20) + "px";
      document.getElementById("container").appendChild(e);
    }
    for (var idx = 0; idx < 40; idx++) {
      var e = document.createElement("div");
      e.setAttribute("id", "div-ver");
      e.style.left = (idx*20) + "px";
      document.getElementById("container").appendChild(e);
    }
  }

  function getSelection(aElement) {
    if (aElement instanceof Ci.nsIDOMNSEditableElement) {
      return aElement.QueryInterface(Ci.nsIDOMNSEditableElement)
                     .editor.selection;
    }
    return null;
  }

  // The DOM geometry is in CSS pixels; query events return integer device
  // pixels relative to the native widget. Mirror ToOutsidePixels on the
  // engine's integer appunit grid, rather than comparing these coordinate sets.
  function cssRectToDevicePixels(aRect, aAppUnitsPerDevPixel) {
    let left = Math.floor(Math.round(aRect.left * 60) / aAppUnitsPerDevPixel);
    let top = Math.floor(Math.round(aRect.top * 60) / aAppUnitsPerDevPixel);
    let right = Math.ceil(Math.round(aRect.right * 60) / aAppUnitsPerDevPixel);
    let bottom = Math.ceil(Math.round(aRect.bottom * 60) / aAppUnitsPerDevPixel);
    return { left, top, width: right - left, height: bottom - top };
  }

  function expectedCaretPosition(aPosition, aSelection, aTransform) {
    is(aPosition.offsetNode, document.getElementById("text"),
       "The point resolves to the textarea");
    ok(aSelection.isCollapsed && aSelection.rangeCount == 1,
       "The editor has one collapsed selection");
    is(aSelection.anchorOffset, aPosition.offset,
       "The editor selection uses the point's offset");
    let pointRect = aPosition.getClientRect();
    let selectionRect = aSelection.getRangeAt(0).getBoundingClientRect();
    ok(pointRect, "The caret position has CSS geometry");
    is(Math.round(pointRect.left * 60), Math.round(selectionRect.left * 60),
       "CaretPosition and the editor Range have the same CSS X appunit");
    is(Math.round(pointRect.top * 60), Math.round(selectionRect.top * 60),
       "CaretPosition and the editor Range have the same CSS Y appunit");
    let expected = cssRectToDevicePixels(pointRect, aTransform.appUnitsPerDevPixel);
    expected.left += aTransform.x;
    expected.top += aTransform.y;
    return expected;
  }

  function testCaretPosition(aDomWinUtils, aOffset, aExpected) {
    let rect = aDomWinUtils.sendQueryContentEvent(
                 aDomWinUtils.QUERY_CARET_RECT,
                 aOffset, 0, 0, 0,
                 aDomWinUtils.QUERY_CONTENT_FLAG_USE_XP_LINE_BREAK);
    ok(rect, "rect returned");
    ok(rect.succeeded, "call succeeded");

    info("left:" + rect.left + " top:" + rect.top);

    is(rect.left, aExpected.left, "The caret X matches the CSS Range in widget device pixels");
    is(rect.top, aExpected.top, "The caret Y matches the CSS Range in widget device pixels");
    ok(rect.width > 0, "The native caret rectangle has nonzero width");
    ok(rect.height > 0, "The native caret rectangle has nonzero height");
  }

  function doTest() {
    let domWinUtils = window.QueryInterface(Ci.nsIInterfaceRequestor)
                            .getInterface(Ci.nsIDOMWindowUtils);

    let text = document.getElementById("text");

    text.focus();

    let appUnitsPerDevPixel = Math.max(1, Math.round(60 / window.devicePixelRatio));
    let editorRoot = text.QueryInterface(Ci.nsIDOMNSEditableElement).editor.rootElement;
    let editorCSSRect = editorRoot.getBoundingClientRect();
    let editorNativeRect = domWinUtils.sendQueryContentEvent(
      domWinUtils.QUERY_EDITOR_RECT, 0, 0, 0, 0,
      domWinUtils.QUERY_CONTENT_FLAG_USE_XP_LINE_BREAK);
    ok(editorNativeRect.succeeded, "The editor rectangle query succeeds");
    let editorDeviceRect = cssRectToDevicePixels(editorCSSRect, appUnitsPerDevPixel);
    is(editorNativeRect.width, editorDeviceRect.width,
       "Editor width verifies the CSS-to-device appunit conversion");
    is(editorNativeRect.height, editorDeviceRect.height,
       "Editor height verifies the CSS-to-device appunit conversion");
    let transform = {
      appUnitsPerDevPixel,
      x: editorNativeRect.left - editorDeviceRect.left,
      y: editorNativeRect.top - editorDeviceRect.top,
    };
    // This Windows helper is local and untransformed. At equal zoom and
    // native scale, the screen origins independently locate its root widget;
    // do not derive both editor and caret translation from query events alone.
    let rootWindow = window.QueryInterface(Ci.nsIInterfaceRequestor)
      .getInterface(Ci.nsIDocShell).QueryInterface(Ci.nsIDocShellTreeItem)
      .rootTreeItem.QueryInterface(Ci.nsIInterfaceRequestor)
      .getInterface(Ci.nsIDOMWindow);
    let rootUtils = rootWindow.QueryInterface(Ci.nsIInterfaceRequestor)
      .getInterface(Ci.nsIDOMWindowUtils);
    is(domWinUtils.fullZoom, rootUtils.fullZoom,
       "The local helper and root widget use the same full zoom");
    let nativeScale = domWinUtils.screenPixelsPerCSSPixel;
    is(nativeScale, rootUtils.screenPixelsPerCSSPixel,
       "The local helper and root widget use the same native scale");
    let screenOffset = {
      x: Math.round((window.mozInnerScreenX - rootWindow.mozInnerScreenX) * nativeScale),
      y: Math.round((window.mozInnerScreenY - rootWindow.mozInnerScreenY) * nativeScale),
    };
    is(transform.x, screenOffset.x,
       "The editor translation agrees with the independent native screen X offset");
    is(transform.y, screenOffset.y,
       "The editor translation agrees with the independent native screen Y offset");
    info("Independent screen offset: " + JSON.stringify(screenOffset));
    info("Caret coordinate transform: " + JSON.stringify(transform));

    let cp = document.caretPositionFromPoint(10, 395);
    let input = cp.offsetNode;
    let offset = cp.offset;
    input.selectionStart = input.selectionEnd = offset;

    let selection = getSelection(text);
    let expected = expectedCaretPosition(cp, selection, transform);

    testCaretPosition(domWinUtils, input.selectionStart, expected);

    testCaretPosition(domWinUtils, input.selectionEnd, expected);

    testCaretPosition(domWinUtils, text.selectionStart, expected);

    testCaretPosition(domWinUtils, text.selectionEnd, expected);

    testCaretPosition(domWinUtils, selection.anchorOffset, expected);

    testCaretPosition(domWinUtils, selection.focusOffset, expected);

    cp = document.caretPositionFromPoint(395, 395);
    input = cp.offsetNode;
    offset = cp.offset;
    input.selectionStart = input.selectionEnd = offset;

    selection = getSelection(text);
    expected = expectedCaretPosition(cp, selection, transform);

    testCaretPosition(domWinUtils, input.selectionStart, expected);

    testCaretPosition(domWinUtils, input.selectionEnd, expected);

    testCaretPosition(domWinUtils, text.selectionStart, expected);

    testCaretPosition(domWinUtils, text.selectionEnd, expected);

    testCaretPosition(domWinUtils, selection.anchorOffset, expected);

    testCaretPosition(domWinUtils, selection.focusOffset, expected);

    done();
  }

</script>

<body onload="doTest()">
<textarea id="text" wrap="on">
Alice was beginning to get very tired of sitting by her sister on the bank, 
and of having nothing to do: once or twice she had peeped into the book 
her sister was reading, but it had no pictures or conversations in it, 
`and what is the use of a book,' thought Alice `without pictures or 
conversation?'

So she was considering in her own mind (as well as she could, for the 
hot day made her feel very sleepy and stupid), whether the pleasure of 
making a daisy-chain would be worth the trouble of getting up and 
picking the daisies, when suddenly a White Rabbit with pink In another 
moment down went Alice after it, never once considering how in the world
she was to get out again. 

The rabbit-hole went straight on like a tunnel for some way, and then 
dipped suddenly down, so suddenly that Alice had not a moment to think 
about stopping herself before she found herself falling down a very deep
well.

Either the well was very deep, or she fell very slowly, for she had 
plenty of time as she went down to look about her and to wonder what was
 going to happen next. First, she tried to look down and make out what 
she was coming to, but it was too dark to see anything; then she looked 
at the sides of the well, and noticed that they were filled with 
cupboards and book-shelves; here and there she saw maps and pictures 
hung upon pegs. She took down a jar from one of the shelves as she 
passed; it was labelled `ORANGE MARMALADE', but to her great 
disappointment it was empty: she did not like to drop the jar for fear 
of killing somebody, so managed to put it into one of the cupboards as 
she fell past it. 
</textarea>
<div id="container"></div>
</body>
</html>
