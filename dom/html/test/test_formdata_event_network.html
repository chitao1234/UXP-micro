<!doctype html>
<meta charset="utf-8">
<title>formdata mutations reach native form and XHR network encoders</title>
<script src="/tests/SimpleTest/SimpleTest.js"></script>
<script>
SimpleTest.waitForExplicitFinish();
let counter=0;
const echo='/tests/dom/html/test/formdata_event_server.sjs';
function fixture(markup) {
  const iframe=document.createElement('iframe');
  iframe.name='formdata-target-'+counter++;
  document.body.appendChild(iframe);
  const form=document.createElement('form');
  form.action=echo;form.target=iframe.name;
  form.innerHTML=markup||'';document.body.appendChild(form);
  return {form,iframe};
}
function send(form,iframe,action) {
  return new Promise((resolve,reject)=>{
    // The harness provides the failure timeout; completion comes from load.
    iframe.onload=()=>{
      if(iframe.contentWindow.location.href==='about:blank')return;
      try {resolve(JSON.parse(iframe.contentDocument.body.textContent));}
      catch(e){reject(e);}
    };
    try {(action||(()=>form.submit()))();} catch(e){reject(e);}
  });
}
window.addEventListener('load',async function(){
try {
  for(const enctype of ['application/x-www-form-urlencoded','multipart/form-data','text/plain']) {
    const {form,iframe}=fixture('<input name=keep value=old><input name=remove value=gone>'+ 
      '<input name=dup value=first><input name=dup value=second><input type=file name=empty>'+ 
      '<button name=submitter value=chosen></button>');
    form.method='POST';form.enctype=enctype;
    let retained,calls=0,submitCalls=0;
    form.onsubmit=e=>{submitCalls++;is(e.submitter,form.querySelector('button'),'requestSubmit exposes submitter');};
    form.onformdata=e=>{
      calls++;retained=e.formData;
      ok(retained.get('empty') instanceof File,enctype+' event has empty File');
      retained.set('keep','new value');retained.delete('remove');
      retained.set('dup','only');retained.append('extra','a&b=c');
      retained.append('upload',new File(['payload\nbytes'],'chosen.txt',{type:'text/plain'}));
      e.preventDefault();
    };
    const received=await send(form,iframe,()=>form.requestSubmit(form.querySelector('button')));
    is(calls,1,enctype+' exactly one formdata');is(submitCalls,1,'one submit event');
    is(received.method,'POST',enctype+' method unchanged');
    ok(received.contentType.indexOf(enctype)===0,enctype+' content type');
    if(enctype==='application/x-www-form-urlencoded') {
      const params=new URLSearchParams(received.body);
      is(params.get('keep'),'new value','URL encoding happens after mutation');
      is(params.get('extra'),'a&b=c','URL values encoded once');
      is(params.get('upload'),'chosen.txt','URL encoder uses File name');
      is(params.get('empty'),'','empty File URL value');
      is(params.getAll('dup').length,1,'URL duplicate removal');
      is(params.get('submitter'),'chosen','URL submitter');
      ok(!params.has('remove'),'URL deletion');
    } else if(enctype==='multipart/form-data') {
      ok(received.body.indexOf('name="keep"\r\n\r\nnew value')!==-1,'multipart string mutation');
      ok(received.body.indexOf('name="extra"\r\n\r\na&b=c')!==-1,'multipart value preserved');
      ok(received.body.indexOf('name="upload"; filename="chosen.txt"\r\nContent-Type: text/plain\r\n\r\npayload\nbytes')!==-1,'multipart File name, MIME and bytes');
      ok(received.body.indexOf('name="empty"; filename=""\r\nContent-Type: application/octet-stream')!==-1,'multipart empty File');
      ok(received.body.indexOf('name="remove"')===-1,'multipart deletion');
      is(received.body.split('name="dup"').length-1,1,'multipart set removes duplicates');
    } else {
      is(received.body,'keep=new value\r\ndup=only\r\nempty=\r\nsubmitter=chosen\r\nextra=a&b=c\r\nupload=chosen.txt\r\n','text/plain entries reflect mutation and File names');
    }
    retained.set('keep','too late');
    ok(received.body.indexOf('too late')===-1,'retained event cannot change already encoded request');
    form.parentNode.removeChild(form);iframe.remove();
  }

  const get=fixture('<input name=a value=before>');
  get.form.onformdata=e=>{
    e.formData.set('a','after');e.formData.append('n','&=');
    get.form.action=echo+'?replace=old';
  };
  const response=await send(get.form,get.iframe);
  is(response.method,'GET','GET form sends native navigation');
  is(response.query,'a=after&n=%26%3D','event changes reach GET query once; action query replaced');

  const emptyGet=fixture('');emptyGet.form.action=echo+'?old=discard#fragment';
  const emptyResponse=await send(emptyGet.form,emptyGet.iframe);
  is(emptyResponse.query,'','empty GET replaces old query');
  ok(emptyGet.iframe.contentWindow.location.href.indexOf('?#fragment')!==-1,'empty GET retains query delimiter and fragment');

  for(const control of ['input','button']) {
    const double=fixture('<input name=n value=first><'+control+' type=submit name=submitter value=one>'+ (control==='button'?'</button>':''));
    const submitter=double.form.querySelector('[type=submit]');
    const seen=[];double.form.onformdata=e=>seen.push(e.formData.get('n'));
    submitter.onclick=()=>{
      double.form.requestSubmit(submitter);
      double.form.elements.n.value='latest';
    };
    const doubleResponse=await send(double.form,double.iframe,()=>submitter.click());
    is(seen.join(','),'first,latest',control+' onclick requestSubmit and default action each construct entries');
    is(new URLSearchParams(doubleResponse.query).get('n'),'latest',control+' default action supersedes onclick requestSubmit');

    const synthetic=fixture('<input name=n value=first><'+control+' type=submit name=submitter value=one>'+ (control==='button'?'</button>':''));
    const syntheticButton=synthetic.form.querySelector('[type=submit]');
    syntheticButton.onclick=()=>{
      synthetic.form.dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}));
      synthetic.form.elements.n.value='latest';
    };
    const syntheticResponse=await send(synthetic.form,synthetic.iframe,()=>syntheticButton.click());
    is(new URLSearchParams(syntheticResponse.query).get('n'),'latest',control+' enclosing click deferral survives synthetic submit');
  }

  const dynamic=fixture('<input name=a value=value>');
  dynamic.form.onformdata=e=>{
    dynamic.form.method='POST';dynamic.form.enctype='text/plain';
    e.formData.append('b','changed');
  };
  const dynamicResponse=await send(dynamic.form,dynamic.iframe);
  is(dynamicResponse.method,'POST','method selected after formdata');
  is(dynamicResponse.contentType,'text/plain','enctype selected after formdata');
  is(dynamicResponse.body,'a=value\r\nb=changed\r\n','selected encoder gets final entries');

  const charset=fixture('<input type=hidden name=_charset_><input name=a value="\u00e9">');
  charset.form.acceptCharset='iso-8859-1';
  charset.form.onformdata=e=>{charset.form.acceptCharset='UTF-8';};
  const charsetResponse=await send(charset.form,charset.iframe);
  is(charsetResponse.query,'_charset_=windows-1252&a=%E9','submission encoding snapshotted before event');

  const cancelled=fixture('<input name=a value=ignored><button></button>');
  let cancelledEvents=0;
  cancelled.form.onformdata=()=>cancelledEvents++;
  cancelled.form.onsubmit=e=>e.preventDefault();
  cancelled.form.requestSubmit();
  is(cancelledEvents,0,'canceled submit does not construct entries');

  const removed=fixture('<input name=a value=ignored>');
  removed.form.onformdata=()=>removed.form.remove();
  removed.form.submit();
  await new Promise(resolve=>SimpleTest.executeSoon(resolve));
  is(removed.iframe.contentWindow.location.href,'about:blank','removal during event aborts navigation');

  const sandbox=document.createElement('iframe');
  sandbox.sandbox='allow-scripts allow-same-origin';
  sandbox.srcdoc='<form action="'+echo+'"><input name=bad value=bad></form>';
  const loaded=new Promise(resolve=>sandbox.onload=resolve);document.body.appendChild(sandbox);await loaded;
  let sandboxEvents=0;const sandboxForm=sandbox.contentDocument.querySelector('form');
  sandboxForm.onformdata=()=>sandboxEvents++;
  sandboxForm.submit();
  is(sandboxEvents,0,'sandbox blocks form submission before entry construction');
  new sandbox.contentWindow.FormData(sandboxForm);
  is(sandboxEvents,1,'sandbox still permits FormData construction');

  const xhrFixture=fixture('<input name=a value=one>');
  xhrFixture.form.onformdata=e=>e.formData.append('upload',new Blob(['xhr bytes'],{type:'text/plain'}),'xhr.txt');
  const xhrData=new FormData(xhrFixture.form);
  const xhrResponse=await new Promise((resolve,reject)=>{
    const xhr=new XMLHttpRequest();xhr.open('POST',echo);xhr.onload=()=>{
      try {const doc=new DOMParser().parseFromString(xhr.responseText,'text/html');resolve(JSON.parse(doc.body.textContent));}catch(e){reject(e);}
    };xhr.onerror=()=>reject(Error('XHR failed'));xhr.send(xhrData);
  });
  ok(xhrResponse.body.indexOf('filename="xhr.txt"')!==-1,'XHR encoder keeps event File filename');
  ok(xhrResponse.body.indexOf('xhr bytes')!==-1,'XHR encoder sends event File bytes');
}catch(e){ok(false,String(e)+' '+e.stack);}
SimpleTest.finish();
});
</script>
<body></body>
