 <!DOCTYPE HTML>
<html>
<head>
  <title>Test for Bug 545812</title>
  <script type="application/javascript" src="/MochiKit/packed.js"></script>
  <script type="application/javascript" src="/tests/SimpleTest/SimpleTest.js"></script>
  <link rel="stylesheet" type="text/css" href="/tests/SimpleTest/test.css"/>
  <script type="application/javascript" src="/tests/SimpleTest/EventUtils.js"></script>
  <script type="application/javascript" src="file_fullscreen-utils.js"></script>
  <style>
  body {
    background-color: black;
  }
  </style>
</head>
<body>
<a target="_blank" href="https://bugzilla.mozilla.org/show_bug.cgi?id=545812">Mozilla Bug 545812</a>
<p id="display"></p>
<div id="content" style="display: none">

</div>
<pre id="test">
<script type="application/javascript">

/** Tests for Bug 545812 **/
SimpleTest.requestFlakyTimeout("untriaged");

// Run the tests which go full-screen in new windows, as mochitests normally
// run in an iframe, which by default will not have the allowfullscreen
// attribute set, so full-screen won't work.
var gTestWindows = [
  // Firefox 78/current run the concurrent-window scenario with both exit
  // policies disabled, while retaining their true defaults for all other tests.
  { test: "file_fullscreen-multiple.html",
    prefs: [["full-screen-api.exit-on.windowRaise", false],
            ["full-screen-api.exit-on.windowOpen", false],
            ["browser.link.open_newwindow.disabled_in_fullscreen", false]] },
  { test: "file_fullscreen-window-policy.html?open",
    prefs: [["browser.link.open_newwindow.disabled_in_fullscreen", false],
            ["full-screen-api.exit-on.windowRaise", false]] },
  { test: "file_fullscreen-window-policy.html?raise",
    prefs: [["browser.link.open_newwindow.disabled_in_fullscreen", false]] },
  { test: "file_fullscreen-rollback.html" },
  { test: "file_fullscreen-esc-exit.html" },
  { test: "file_fullscreen-denied.html" },
  { test: "file_fullscreen-api.html" },
  { test: "file_fullscreen-plugins.html" },
  { test: "file_fullscreen-hidden.html" },
  { test: "file_fullscreen-svg-element.html" },
  { test: "file_fullscreen-navigation.html" },
  { test: "file_fullscreen-scrollbar.html" },
  { test: "file_fullscreen-selector.html" },
  { test: "file_fullscreen-shadowdom.html" },
  { test: "file_fullscreen-top-layer.html" },
  { test: "file_fullscreen-backdrop.html" },
  { test: "file_fullscreen-nested.html" },
  { test: "file_fullscreen-prefixed.html" },
  { test: "file_fullscreen-unprefix-disabled.html" },
  { test: "file_fullscreen-lenient-setters.html" },
];

var testWindow = null;
var gTestIndex = 0;
var gCurrentTestHasPrefs = false;

function finish() {
  SimpleTest.finish();
}

// Match Firefox 78's launcher: return focus after closing the old child,
// then focus the ready new child directly, without raising the main window
// between loading the child and starting its fullscreen scenario.
function advanceToNextTest() {
  if (gCurrentTestHasPrefs) {
    gCurrentTestHasPrefs = false;
    SpecialPowers.popPrefEnv(() => SimpleTest.executeSoon(runNextTest));
  } else {
    SimpleTest.executeSoon(runNextTest);
  }
}

function nextTest() {
  if (testWindow) {
    info("Waiting for focus to return to main window");
    window.addEventListener("focus", function() {
      info("main window focused, starting next test");
      advanceToNextTest();
    }, {once: true});
    testWindow.close();
  } else {
    advanceToNextTest();
  }
}

function runNextTest() {
  if (gTestIndex < gTestWindows.length) {
    let test = gTestWindows[gTestIndex++];
    function openTestWindow() {
      info("Run test " + test.test);
      testWindow = window.open(test.test, "", "width=500,height=500,scrollbars=yes");
      // Wait for the new child's load and first paint before focusing it.
      // Borrowed from Firefox 78/current; upstream Bug 1465078.
      waitForLoadAndPaint(testWindow, function() {
        SimpleTest.waitForFocus(function() {
          info("The fullscreen child is focused");
          testWindow.begin();
        }, testWindow);
      });
    }
    // This SimpleTest version records an undo frame only for actual changes.
    // Never pair a no-op push with a pop: it would pop the outer fixture prefs.
    let changedPrefs = "prefs" in test
      ? test.prefs.filter(([name, value]) =>
          SpecialPowers.getBoolPref(name) != value)
      : [];
    if (changedPrefs.length) {
      gCurrentTestHasPrefs = true;
      SpecialPowers.pushPrefEnv({"set": changedPrefs}, openTestWindow);
    } else {
      openTestWindow();
    }
  } else {
    SimpleTest.finish();
  }
}

try {
  window.fullScreen = true;
} catch (e) {
}
is(window.fullScreen, false, "Shouldn't be able to set window fullscreen from content");
// Ensure the full-screen api is enabled, and will be disabled on test exit.
// Disable the requirement for trusted contexts only, so the tests are easier
// to write
addLoadEvent(function() {
  SpecialPowers.pushPrefEnv({
      "set": [
        // This fixture tests native window geometry/focus. The app normally
        // diverts all popups into tabs; select the existing feature-window
        // policy, as browser_test_toolbars_visibility.js does.
        ["browser.link.open_newwindow.restriction", 2],
        ["full-screen-api.enabled", true],
        ["full-screen-api.unprefix.enabled", true],
        ["full-screen-api.allow-trusted-requests-only", false],
        ["full-screen-api.transition-duration.enter", "0 0"],
        ["full-screen-api.transition-duration.leave", "0 0"],
        ["dom.webcomponents.enabled", true]
      ]}, nextTest);
});
SimpleTest.waitForExplicitFinish();
</script>
</pre>
</body>
</html>
