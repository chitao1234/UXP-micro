<!DOCTYPE HTML>
<html>
<!--
https://bugzilla.mozilla.org/show_bug.cgi?id=1242019
-->
<head>
  <meta charset="utf-8">
  <title>Test for Bug 1242019</title>
  <script type="application/javascript" src="/tests/SimpleTest/SimpleTest.js"></script>
  <link rel="stylesheet" type="text/css" href="/tests/SimpleTest/test.css"/>
</head>
<body>
<a target="_blank" href="https://bugzilla.mozilla.org/show_bug.cgi?id=1242019">Mozilla Bug 1242019</a>
<p id="display"></p>

<iframe id="cspframe"></iframe>

<pre id="test">

<script class="testbody" type="text/javascript">
function cleanup() {
  SpecialPowers.postConsoleSentinel();
  SimpleTest.finish();
};

const expectedURI = "data:image/png;base64,iVBORw0KGgoAAAANSU";
const ellipsis = SpecialPowers.Cc["@mozilla.org/preferences-service;1"]
  .getService(SpecialPowers.Ci.nsIPrefBranch)
  .getComplexValue("intl.ellipsis", SpecialPowers.Ci.nsIPrefLocalizedString).data;
const bundle = SpecialPowers.Cc["@mozilla.org/intl/stringbundle;1"]
  .getService(SpecialPowers.Ci.nsIStringBundleService)
  .createBundle("chrome://global/locale/security/csp.properties");
// CSP_LogMessage adds this nonlocalized category prefix before the bundle text.
const expectedMessage = "Content Security Policy: " + bundle.formatStringFromName(
  "CSPViolationWithURI", ["img-src", expectedURI + ellipsis], 2);

SpecialPowers.registerConsoleListener(function ConsoleMsgListener(aMsg) {
  if (aMsg.errorMessage && aMsg.errorMessage.indexOf(expectedURI) != -1) {
    // UXP3dd8bc0ddba uses the localized ellipsis. Compare the complete error
    // text: splitting on an ASCII period accidentally counted its punctuation.
    is(expectedURI.length, 40, "The expected URI prefix has exactly 40 characters");
    is(aMsg.errorMessage, expectedMessage,
       "The console contains exactly 40 URI characters and the localized ellipsis");
    SimpleTest.executeSoon(cleanup);
  }
});

// set up and start testing
SimpleTest.waitForExplicitFinish();
document.getElementById('cspframe').src = 'file_data-uri_blocked.html';
</script>
</pre>
</body>
</html>
