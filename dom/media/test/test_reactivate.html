<!DOCTYPE HTML>
<html>
<head>
  <title>Test reactivation of a media element from a dead document</title>
  <script type="text/javascript" src="/tests/SimpleTest/SimpleTest.js"></script>
  <link rel="stylesheet" type="text/css" href="/tests/SimpleTest/test.css" />
  <script type="text/javascript" src="manifest.js"></script>
</head>
<body>

<iframe id="frame" src="reactivate_helper.html"></iframe>

<pre id="test">
<script class="testbody" type="text/javascript">

var elements;

function playElement(e) {
  // All elements played out, finish the test case.
  if (!e) {
    SimpleTest.finish();
    return;
  }

  ok(!e.ownerDocument.defaultView,
     e._name + ": element starts in the destroyed iframe document");
  var reviveElement = function() {
    e.onended = function() {
      info("Element ended: " + e._name);
      ok(e.ended, e._name + ": reactivated element played to completion");
      removeNodeAndSource(e);
      // Play next element.
      playElement(elements.pop());
    }
    // play() creates its promise in the owner document's window. A destroyed
    // document has no such window (current Firefox also rejects the old call).
    // Reactivate by adoption first, retaining the loaded media and decoder.
    document.body.appendChild(e);
    is(e.ownerDocument, document, e._name + ": adopted into the live document");
    info("Element play: " + e._name);
    e.play().then(function() {
      ok(!e.paused, e._name + ": reactivated play promise resolved");
    }, function(error) {
      ok(false, e._name + ": reactivated play rejected: " + error);
      removeNodeAndSource(e);
      SimpleTest.finish();
    });
  }
  setTimeout(reviveElement, 2000);
}

function loadedAll(elementList) {
  elements = elementList;

  // Log events for debugging.
  var events = ["suspend", "play", "canplay", "canplaythrough", "loadstart", "loadedmetadata",
                "loadeddata", "playing", "ended", "error", "stalled", "emptied", "abort",
                "waiting", "pause"];
  function logEvent(e) {
    info(e.target._name + ": got " + e.type);
  }
  elementList.forEach(function(element) {
    events.forEach(function(evt) {
      element.addEventListener(evt, logEvent, false);
    });
  });

  // Blow away the subframe
  document.body.removeChild(document.getElementById("frame"));

  // Play elements one by one to avoid hitting bug 847903 on MacOSX.
  playElement(elements.pop());
}
</script>
</pre>
</body>
</html>
