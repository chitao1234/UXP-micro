<!doctype html>
<html>
<head>
  <title>Test for Bug 406541</title>
  <script type="application/javascript" src="/tests/SimpleTest/SimpleTest.js"></script>
  <script type="text/javascript" src="plugin-utils.js"></script>
  <link rel="stylesheet" type="text/css" href="/tests/SimpleTest/test.css"/>

  <meta http-equiv="content-type" content="text/html; charset=utf-8">
</head>
<body>
<script type="application/x-child-payload" id="child-payload">
  // This is injected into the file:/// origin iframe, see below.

  // appletA should spawn, appletB, with a codebase outside the temp directory,
  // should not.
  var appletA = document.createElement("applet");
  var appletB = document.createElement("applet");
  var appletC = document.createElement("applet");
  appletA.type = appletB.type = appletC.type = "application/x-java-test";
  appletB.setAttribute("codebase", "file:///");
  appletC.setAttribute("codebase", "./subdir_bug406541/");
  document.body.appendChild(appletA);
  document.body.appendChild(appletB);
  document.body.appendChild(appletC);
  function isSpawned(plugin) {
    try {
      var x = plugin.getJavaCodebase();
      return true;
    } catch (e) {
      window.parent.postMessage({diagnostic: plugin.outerHTML + ": " + e +
        "; document=" + document.documentURI}, "*");
    }
    return false;
  }
  window.parent.postMessage({ "A": isSpawned(appletA),
                              "B": isSpawned(appletB),
                              "C": isSpawned(appletC) }, "*");
</script>
<script type="application/javascript">
  SimpleTest.waitForExplicitFinish();
  setTestPluginEnabledState(SpecialPowers.Ci.nsIPluginTag.STATE_ENABLED,
                            "Java Test Plug-in");
  SpecialPowers.pushPrefEnv({ "set": [
                              ['plugin.java.mime', 'application/x-java-test']
                            ] }, runTest);

  // The original test exercises directory-based file origins. The current
  // unique-origin policy intentionally suppresses all three applets; exercise
  // both policies without changing the product default.
  var cases = [
    {uniqueOrigin: true, allowed: false},
    {uniqueOrigin: false, allowed: true},
  ];
  var caseIndex = 0;

  function runTest() {
    var current = cases[caseIndex++];
    SpecialPowers.pushPrefEnv({set: [
      ["security.fileuri.unique_origin", current.uniqueOrigin],
    ]}, function() { runCase(current); });
  }

  function runCase(current) {
    var Cc = SpecialPowers.Cc;
    var Ci = SpecialPowers.Ci;
    var directory = Cc["@mozilla.org/file/directory_service;1"]
      .getService(Ci.nsIProperties).get("TmpD", Ci.nsIFile);
    directory.append("bug406541");
    directory.createUnique(Ci.nsIFile.DIRECTORY_TYPE, 0700);
    var file = directory.clone();
    file.append("test.html");
    file.create(Ci.nsIFile.NORMAL_FILE_TYPE, 0600);
    var subdir = directory.clone();
    subdir.append("subdir_bug406541");
    subdir.create(Ci.nsIFile.DIRECTORY_TYPE, 0700);
    var fileURI = Cc["@mozilla.org/network/io-service;1"]
      .getService(Ci.nsIIOService).newFileURI(file).spec;
    SimpleTest.registerCleanupFunction(function() {
      if (directory.exists()) {
        directory.remove(true);
      }
    });

    var frame = document.createElement("iframe");
    var loaded = false;
    frame.addEventListener("load", function() {
      if (!loaded) {
        loaded = true;
        SpecialPowers.wrap(frame.contentWindow).location.href = fileURI;
        return;
      }
      var innerdoc = SpecialPowers.wrap(frame.contentWindow).document;
      var script = innerdoc.createElement("script");
      script.textContent = document.getElementById("child-payload").textContent;
      window.onmessage = function(message) {
        if (message.source !== frame.contentWindow) {
          return;
        }
        if (message.data.diagnostic) {
          info(message.data.diagnostic);
          return;
        }
        var context = "unique_origin=" + current.uniqueOrigin + ": ";
        is(message.data.A, current.allowed, context + "same-directory applet");
        is(message.data.B, false, context + "outside-directory applet is blocked");
        is(message.data.C, current.allowed, context + "child-directory applet");
        frame.remove();
        window.onmessage = null;
        directory.remove(true);
        if (caseIndex < cases.length) {
          runTest();
        } else {
          SimpleTest.finish();
        }
      };
      innerdoc.body.appendChild(script);
    });
    document.body.appendChild(frame);
  }
</script>
</body>
</html>
